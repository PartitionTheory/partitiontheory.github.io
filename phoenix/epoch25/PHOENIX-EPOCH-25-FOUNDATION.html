<style>
:root {
    --bg: #0d0d0d;
    --fg: #ffffff;
    --fg-secondary: #e6e6e6;
    --link: #d0e0ff;
}
[data-theme="light"] {
    --bg: #ffffff;
    --fg: #222222;
    --fg-secondary: #555555;
    --link: #0050a0;
}
body {
    background: var(--bg);
    color: var(--fg);
    font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    margin: 40px auto;
    max-width: 900px;
    line-height: 1.6;
}
a { color: var(--link); }
p { color: var(--fg-secondary); }
.theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    background: var(--fg);
    color: var(--bg);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    user-select: none;
}
.nav-block {
    display: flex;
    justify-content: space-between;
    margin: 20px 0;
    padding: 10px 0;

    border-bottom: 1px solid var(--fg-secondary);
}
.nav-link {
    color: var(--link);
    font-size: 16px;
    text-decoration: none;
}
.nav-link:hover {

}
.nav-disabled {

}
.nav-spacer {
    flex: 1;

</style>

<body>
<div class="theme-toggle" onclick="toggleTheme()">Toggle Theme</div>

<script>
function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current == 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
}
</script>
